<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edgenuity AI Settings</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
    }
    .group {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0;
    }
    label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
    }
    input[type="text"],
    input[type="password"],
    input[type="number"],
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 12px;
    }
    .hint {
      font-size: 11px;
      color: #4ade80;
      margin: 2px 0 8px;
      line-height: 1.35;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    #status {
      margin-top: 8px;
      text-align: center;
      font-size: 12px;
      color: #4ade80;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h2>Edgenuity AI Solver v2.1</h2>

  <div class="group">
    <div class="row">
      <span>Enable Auto-Solver</span>
      <input type="checkbox" id="enabled" checked />
    </div>
    <div class="row">
      <span>Auto-Check Per Question</span>
      <input type="checkbox" id="autoSubmit" checked />
    </div>
    <div class="row">
      <span>Auto-Advance Sequentially (1, 2, 3...)</span>
      <input type="checkbox" id="autoAdvance" checked />
    </div>
    <div class="row">
      <span>Auto-Submit Quiz (10) / Test (25)</span>
      <input type="checkbox" id="autoSubmitQuiz" checked />
    </div>
    <div class="row">
      <span>Auto-Click "Click to Begin"</span>
      <input type="checkbox" id="autoStartQuiz" checked />
    </div>
    <div class="row">
      <span>Auto-Play Paused Videos</span>
      <input type="checkbox" id="autoPlayVideos" checked />
    </div>
  </div>

  <div class="group">
    <label for="provider">Free AI Provider</label>
    <select id="provider">
      <option value="free">Built-in Keyless Free AI (Parallel Race)</option>
      <option value="gemini">Google Gemini (Free AI Studio Key)</option>
      <option value="groq">Groq Cloud (Free API Key)</option>
      <option value="openrouter">OpenRouter (Free Models Key)</option>
      <option value="ollama">Ollama (Local, No API Key)</option>
    </select>

    <div id="freeHint" class="hint">
      Races LLM7, Kilo Code, and OVHcloud in parallel so the fastest free model answers in under 1 second.
    </div>

    <div id="apiKeyGroup" style="display: none;">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="Paste free Gemini, Groq, or OpenRouter key..." />

      <label for="model">Model Name</label>
      <input type="text" id="model" placeholder="gemini-2.5-flash" />
    </div>

    <div id="ollamaGroup" style="display: none;">
      <label for="ollamaUrl">Ollama Endpoint</label>
      <input type="text" id="ollamaUrl" value="http://localhost:11434/api/generate" />

      <label for="ollamaModel">Ollama Model</label>
      <input type="text" id="ollamaModel" value="llama3.2" />
    </div>

    <label for="delayMs">Action Delay (ms)</label>
    <input type="number" id="delayMs" value="1400" min="600" step="200" />
  </div>

  <button id="saveBtn">Save Settings</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
